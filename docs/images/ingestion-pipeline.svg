          <text class="s" x="90" y="147" text-anchor="middle">esearch query</text>
          <text class="s" x="90" y="162" text-anchor="middle">hippocampus·memory</text>
        </g>
        <g>
          <rect class="n" x="220" y="100" width="140" height="74" rx="4"/>
          <circle class="built" cx="348" cy="112" r="4"/>
          <text class="t" x="290" y="128" text-anchor="middle">candidates.csv</text>
          <text class="s" x="290" y="147" text-anchor="middle">human review</text>
          <text class="s" x="290" y="162" text-anchor="middle">keep = yes | no</text>
        </g>
        <g>
          <rect class="n" x="420" y="100" width="140" height="74" rx="4"/>
          <circle class="built" cx="548" cy="112" r="4"/>

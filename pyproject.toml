[project]
name = "neuro-rag"
version = "0.1.0"
description = "Corrective RAG over hippocampus and memory papers"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9",
    "langchain-text-splitters>=1.1",
    "pymupdf>=1.28",
    "python-dotenv>=1.2",
    "qdrant-client>=1.19",
    "requests>=2.32",
    "sentence-transformers>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Qdrant (docker compose up -d)"]

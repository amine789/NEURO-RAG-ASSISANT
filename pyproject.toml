[project]
name = "neuro-rag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pymupdf", "tokenizers", "qdrant-client", "fastembed"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the running Qdrant from docker compose"]
